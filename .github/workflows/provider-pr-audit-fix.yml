name: Provider PR audit fix

on:
  push:
    branches:
      - tmp/provider-pr-audit-fix

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Save audit script and checkout audited head
        run: |
          git show HEAD:.github/provider_pr_audit_fix.py > /tmp/provider_pr_audit_fix.py
          git checkout --detach 40b5833265a36ae436cd4571d974df2e98d313ba
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record baseline typecheck
        run: |
          set +e
          pnpm typecheck
          code=$?
          set -e
          echo "baseline_typecheck_exit=$code" >> "$GITHUB_STEP_SUMMARY"
      - name: Add regression tests first
        run: python /tmp/provider_pr_audit_fix.py test
      - name: Verify regression test is red before implementation
        run: |
          set +e
          pnpm vitest run server/provider-key-flow.test.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Regression test unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "regression_test_red_exit=$code" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply implementation fixes
        run: python /tmp/provider_pr_audit_fix.py implement
      - name: Verify fixed provider flow
        run: |
          pnpm typecheck
          pnpm lint
          pnpm vitest run server/provider-key-flow.test.ts server/providers/catalog.test.ts server/providers/capabilities.test.ts src/components/ProviderManager.test.ts src/components/EngineLibrary.test.ts
          git diff --check
      - name: Commit and update feature branch
        run: |
          git config user.name "h55n"
          git config user.email "144530465+h55n@users.noreply.github.com"
          git add server/config.ts server/provider-key-flow.test.ts server/drivers/openai-chat.ts server/drivers/openai-compat.ts server/providers/catalog.ts src/components/EngineLibrary.tsx src/components/ProviderManager.tsx
          git commit -m "fix: preserve upstream config and validate managed provider keys"
          git push origin HEAD:feat/universal-provider-accounts --force
