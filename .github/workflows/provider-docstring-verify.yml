name: Provider Docstring Verify

on:
  push:
    branches:
      - tmp/verify-provider-docstrings

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm vitest run server/providers/catalog.test.ts server/providers/capabilities.test.ts src/components/ProviderManager.test.ts src/components/EngineLibrary.test.ts
