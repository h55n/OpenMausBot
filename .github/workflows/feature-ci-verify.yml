name: Feature CI Verify

on:
  push:
    branches: [tmp/feature-ci-verify]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate locale catalogs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm i18n:check
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run tests
        run: pnpm test
      - run: pnpm check:electron
      - name: production UI build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vite build
