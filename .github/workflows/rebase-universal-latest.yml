name: Rebase universal provider accounts

on:
  push:
    branches: [tmp/rebase-universal-latest]

permissions:
  contents: write

jobs:
  rebase-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reapply feature commit on latest upstream
        run: |
          git config user.name "h55n"
          git config user.email "144530465+h55n@users.noreply.github.com"
          git fetch origin feat/universal-provider-accounts
          git cherry-pick cace1292b16640b60e52dc04a0b569387b57e42b
          git push origin HEAD:feat/universal-provider-accounts --force
