name: Temporary feature rebase

on:
  push:
    branches: [tmp/upstream-main-sync]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/upstream-main-sync
          fetch-depth: 0
      - name: Rebase feature commits onto latest upstream main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/universal-provider-accounts
          git fetch upstream main || git remote add upstream https://github.com/milind-soni/OpenMausBot.git && git fetch upstream main
          git checkout -B tmp/rebased-universal origin/feat/universal-provider-accounts
          git rebase upstream/main -X theirs
          git push --force origin tmp/rebased-universal
