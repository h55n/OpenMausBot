name: Temporary feature merge

on:
  push:
    branches: [tmp/upstream-main-sync]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/upstream-main-sync
          fetch-depth: 0
      - name: Merge feature into latest upstream main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/universal-provider-accounts
          git checkout -B tmp/merged-universal
          git merge origin/feat/universal-provider-accounts -X theirs --no-edit -m 'merge universal provider accounts onto latest upstream main'
          git push --force origin tmp/merged-universal
