name: Temporary final upstream sync

on:
  push:
    branches: [tmp/upstream-main-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/upstream-main-sync
          fetch-depth: 0
      - name: Build clean synchronized tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/universal-provider-accounts
          git fetch upstream main || { git remote add upstream https://github.com/milind-soni/OpenMausBot.git; git fetch upstream main; }
          git checkout -B tmp/final-sync upstream/main
          files=(
            docs/providers/unified-connections.md
            docs/superpowers/plans/2026-09-12-universal-provider-accounts.md
            docs/superpowers/specs/2026-09-12-universal-provider-accounts-design.md
            server/config.ts
            server/drivers/openai-chat.ts
            server/drivers/openai-compat.ts
            server/providers/capabilities.test.ts
            server/providers/capabilities.ts
            server/providers/catalog.test.ts
            server/providers/catalog.ts
            src/components/EngineLibrary.test.ts
            src/components/EngineLibrary.tsx
            src/components/ProviderManager.test.ts
            src/components/ProviderManager.tsx
          )
          git checkout origin/feat/universal-provider-accounts -- "${files[@]}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/drivers/openai-compat.ts')
          s = p.read_text()
          marker = 'const DRIVER_KIND = "openai-compat";\n'
          addition = '''const DRIVER_KIND = "openai-compat";\nconst DEFAULT_IDLE_TIMEOUT_MS = 180_000;\nconst idleTimeoutMs = () => {\n  const raw = process.env.OPENMAUS_OPENAI_COMPAT_IDLE_TIMEOUT_MS;\n  if (!raw) return DEFAULT_IDLE_TIMEOUT_MS;\n  const value = Number(raw);\n  return Number.isSafeInteger(value) && value >= 1_000 && value <= 2_147_483_647 ? value : DEFAULT_IDLE_TIMEOUT_MS;\n};\n'''
          if 'DEFAULT_IDLE_TIMEOUT_MS' not in s:
              s = s.replace(marker, addition, 1)
          s = s.replace('timeoutMs: 120_000,', 'timeoutMs: idleTimeoutMs(),', 1)
          p.write_text(s)
          p = Path('server/drivers/openai-chat.ts')
          s = p.read_text()
          start = s.index('  const complete = async (')
          end = s.index('\n  const messagesFor =', start)
          complete = '''  const complete = async (\n    messages: OpenAIChatMessage[],\n    model: string,\n    stream: boolean,\n    signal?: AbortSignal,\n    onDelta?: (delta: string, kind: "assistant_text" | "reasoning_text") => void,\n  ): Promise<Completion> => {\n    const timeoutController = new AbortController();\n    let idleTimer: NodeJS.Timeout | null = null;\n    const resetIdleTimer = () => {\n      if (idleTimer) clearTimeout(idleTimer);\n      idleTimer = setTimeout(() => {\n        timeoutController.abort(new DOMException("Streaming idle timeout elapsed", "AbortError"));\n      }, options.timeoutMs);\n    };\n    resetIdleTimer();\n    try {\n      const activeSignal = signal\n        ? AbortSignal.any([signal, timeoutController.signal])\n        : timeoutController.signal;\n      const response = await fetchSameOrigin(`${options.apiUrl}/chat/completions`, {\n        method: "POST",\n        headers: { authorization: `Bearer ${options.apiKey}`, "content-type": "application/json" },\n        body: JSON.stringify(options.requestBody(model, messages, stream)),\n        signal: activeSignal,\n      });\n      if (!response.ok) {\n        const body = await response.text().catch(() => "");\n        throw new Error(`${options.httpErrorLabel} HTTP ${response.status}${body ? `: ${body.slice(0, 200)}` : ""}`);\n      }\n      if (!stream) {\n        const json = await response.json() as CompletionJson;\n        const message = json.choices?.[0]?.message;\n        if (Array.isArray(message?.tool_calls) && message.tool_calls.length > 0) {\n          throw new Error("provider returned tool calls, but this OpenAI-compatible driver does not support tool execution yet");\n        }\n        return {\n          text: typeof message?.content === "string" ? message.content : "",\n          reasoning: options.reasoning && typeof message?.reasoning_content === "string"\n            ? message.reasoning_content\n            : "",\n          usage: usageFrom(json.usage),\n        };\n      }\n      if (!response.body) {\n        throw new Error(options.noBodyError ?? `${options.httpErrorLabel} returned no response body`);\n      }\n      let text = "";\n      let reasoning = "";\n      let usage: Usage | null = null;\n      const reader = response.body.getReader();\n      const decoder = new TextDecoder();\n      let buffer = "";\n      try {\n        readLoop: for (;;) {\n          const { done, value } = await reader.read();\n          if (done) {\n            if (buffer.trim() === "data: [DONE]") break;\n            throw new DOMException("Stream ended before completion", "AbortError");\n          }\n          resetIdleTimer();\n          buffer += decoder.decode(value, { stream: true });\n          let newline: number;\n          while ((newline = buffer.indexOf("\\n")) !== -1) {\n            const line = buffer.slice(0, newline).trim();\n            buffer = buffer.slice(newline + 1);\n            if (!line.startsWith("data:")) continue;\n            const data = line.slice(5).trim();\n            if (data === "[DONE]") break readLoop;\n            let chunk: CompletionJson;\n            try {\n              chunk = JSON.parse(data) as CompletionJson;\n            } catch {\n              continue;\n            }\n            const delta = chunk.choices?.[0]?.delta;\n            if (Array.isArray(delta?.tool_calls) && delta.tool_calls.length > 0) {\n              throw new Error("provider returned tool calls, but this OpenAI-compatible driver does not support tool execution yet");\n            }\n            const reasoningDelta = options.reasoning && typeof delta?.reasoning_content === "string"\n              ? delta.reasoning_content\n              : "";\n            const contentDelta = typeof delta?.content === "string" ? delta.content : "";\n            if (reasoningDelta) {\n              reasoning += reasoningDelta;\n              onDelta?.(reasoningDelta, "reasoning_text");\n            }\n            if (contentDelta) {\n              text += contentDelta;\n              onDelta?.(contentDelta, "assistant_text");\n            }\n            if (chunk.usage) usage = usageFrom(chunk.usage);\n          }\n        }\n      } finally {\n        await reader.cancel().catch(() => {});\n      }\n      return { text, reasoning, usage };\n    } finally {\n      if (idleTimer) clearTimeout(idleTimer);\n    }\n  };\n'''
          p.write_text(s[:start] + complete + s[end:])
          PY
          git add -A
          git commit -m 'chore: synchronize universal provider accounts with upstream main'
          git push --force origin tmp/final-sync
