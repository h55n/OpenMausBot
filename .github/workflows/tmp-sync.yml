name: Temporary upstream sync

on:
  push:
    branches: [feat/universal-provider-accounts]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-provider-accounts
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/milind-soni/OpenMausBot.git
          git fetch upstream main
          git checkout -B tmp/merged-universal-ours
          git merge upstream/main -X ours --no-edit -m 'merge upstream main into universal provider accounts'
          git push --force origin tmp/merged-universal-ours
